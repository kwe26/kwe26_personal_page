<!DOCTYPE html>
<html>

<head>
    <title>KWEE26's Factory | {title}</title>
    <!-- Main backgrounds -->
    <link rel="preload" as="image" href="/assets/bkg.png" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/navbar.png">
    <link rel="preload" as="image" href="/assets/test.png">
    <link rel="preload" as="image" href="/assets/active.png">
    <link rel="preload" as="image" href="/assets/initial.png">
    <link rel="preload" as="image" href="/assets/my_anime_favs.png">

    <!-- Anime dialog backgrounds -->
    <link rel="preload" as="image" href="/assets/dialog.png">
    <link rel="preload" as="image" href="/assets/zero_dialog.png">
    <link rel="preload" as="image" href="/assets/op_dialog.png">
    <link rel="preload" as="image" href="/assets/onk_dialog.png">
    <link rel="preload" as="image" href="/assets/kaguya_dialog.png">

    <!-- GitHub button -->
    <link rel="preload" as="image" href="/assets/github_btn_normal.png">
    <link rel="preload" as="image" href="/assets/github_btn_hover.png">

    <!-- Donate button -->
    <link rel="preload" as="image" href="/assets/donate_btn_normal.png">
    <link rel="preload" as="image" href="/assets/donate_btn_hover.png">

    <!-- Okay button -->
    <link rel="preload" as="image" href="/assets/okay_normal.png">
    <link rel="preload" as="image" href="/assets/okay_hover.png">

    <!-- No button -->
    <link rel="preload" as="image" href="/assets/no_normal.png">
    <link rel="preload" as="image" href="/assets/no_hover.png">

    <!-- Google Fonts preconnection -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Agrave+Pro:wght@100..700&family=Just+Me+Again+Down+Here&display=swap">

    <link rel="stylesheet" type="text/css" href="/style.css" />
    <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/61016345?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>
    <nav class="navbar">
        <a href="/home" class="nav-item animate__animated animate__slideInLeft {home}"> Home </a>
        <a href="/notes" class="nav-item animate__animated animate__slideInLeft {notes}">Notes </a>
        <a href="/arts" class="nav-item animate__animated animate__slideInLeft {arts}"> Arts </a>
    </nav>

    <dialog id="modal" class="tbhk_image animate__animated animate__slideInDown">
        <div class="dialog-content">
            <h1 id="modal-title"></h1>
            <div id="modal-content"></div>
            <div id="modal-buttons" class="side_row" style="padding-top: 50px;">
                <a class="no-btn" href="javascript:closeDialog()"></a>
                <a class="okay-btn" id="okay-btn"></a>
            </div>
        </div>
    </dialog>

    <dialog id="modal2" class="animate__animated animate__slideInDown">
        <div class="dialog-content">
            <p style="padding: 0; margin: 0;">Press Esc to Exit-- Music Keeps Playing btw</p>
            <h1 id="modal2-title" style="padding: 0; margin: 0;"></h1>
            <div id="modal2-content"></div>
        </div>
    </dialog>

    <div class="main-content" id="content">{maincontent}</div>

    <script type="text/javascript">
        // Opens the custom dialog
        function openDialog(title, content, okayBtn = "") {
            document.getElementById('modal').showModal();
            document.getElementById("modal-title").innerHTML = title;
            document.getElementById("modal-content").innerHTML = content;
            document.getElementById("okay-btn").setAttribute("href", okayBtn);
        }

        // Custom Dialog for Anime MVs
        function openDialog2(title, content, okayBtn = "") {
            document.getElementById('modal2').showModal();
            document.getElementById("modal2-title").innerHTML = title;
            document.getElementById("modal2-content").innerHTML = content;
        }

        // openAnimeSong function to open in custom openDialog2's
        function openAnimeSong(val = "") {
            if (val == "tbhk") {
                document.getElementById('modal2').className = "tbhk_img animate__animated animate__slideInDown";
                openDialog2("Toilet-bound Hanako-kun", `<iframe width="450" height="200" src="https://www.youtube.com/embed/VCR5hKNMKBo?list=RDVCR5hKNMKBo&autoplay=1" title="【AMV】Landbound boy Hanako-kun × KagomeKagome 【English subtitles】" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`)
            } else if (val == "rezero") {
                openDialog2("Re:Zero Ender Ember AMV", `<iframe width="450" height="200" src="https://www.youtube.com/embed/K0f7jwGBRGM?list=RDK0f7jwGBRGM&autoplay=1" title="【リゼロ】MYTH & ROID feat. TK (凛として時雨)「Ender Ember」-lyric video-" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`)
                document.getElementById('modal2').className = "zero_img animate__animated animate__slideInDown";
            } else if (val == "kaguya") {
                openDialog2("Kaguya-sama: Love is war", `<iframe width="450" height="200" src="https://www.youtube.com/embed/4ANpychCrf0?list=RD4ANpychCrf0&autoplay=1" title="Masayuki Suzuki feat. Aoi Koga"Abunaikioku"×"Kaguya-sama: Love Is War"Memories Music Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`)
                document.getElementById('modal2').className = "kaguya_img animate__animated animate__slideInDown";
            } else if (val == "onk") {
                openDialog2("Oshi No Ko: TEST ME", `<iframe width="450" height="200" src="https://www.youtube.com/embed/E4zWgXBtqDs?list=RDE4zWgXBtqDs&autoplay=1" title="Lyrics AMV』 Oshi no Ko OP Full - TEST ME / CHANMINA" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`)
                document.getElementById('modal2').className = "onk_img animate__animated animate__slideInDown";
            } else if (val == "op") {
                openDialog2("One Piece", `<iframe width="450" height="200" src="https://www.youtube.com/embed/YuyswfLIVG0?list=RDYuyswfLIVG0&autoplay=1" title="GRe4N BOYZ - 'Kiseki' x "ONE PIECE" | Manga Collaboration Video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`)
                document.getElementById('modal2').className = "op_img animate__animated animate__slideInDown";
            }
        }

        // closes Main Dialog
        function closeDialog() {
            document.getElementById('modal').close();
        }

        const isSmallScreen = window.matchMedia("(max-width: 1199px)").matches;

        if (isSmallScreen) {
            alert("The Website is best viewed in larger screen as max width with 1200px");
        }

        // Link Opening
        function openLink(link) {
            if (link == "github") {
                openDialog("You want to leave my website?", "Ohh you just want to explore what have i done on github am i right?? right??", `javascript:window.open('https://github.com/kwe26', '_blank', 'noopener,noreferrer')`);
            } else if (link == "donate") {
                openDialog("You want to donate??", "I would love your donations, ;33333 thanksss love uu", `javascript:window.open('https://github.com/sponsors/kwe26', '_blank', 'noopener,noreferrer')`)
            }
        }

        // open guest note dialog
        function openGuestNote(){
            let dialogHtml = `
                <label>Select Your Alias Name</label>
                <select id="namePremined">
                    <option value="Hanako">Hanako</option>
                    <option value="Yashiro Nene">Yashiro Nene</option>
                    <option value="Aoi Akane">Aoi Akane</option>
                    <option value="Akane Aoi">Akane Aoi</option>
                    <option value="Mitsuba Sosuke">Mitsuba Sosuke</option>
                </select>
                <label>Write something memorable:</label>
                <input type="text" id="memorable" placeholder="Your words" />
            `;

            openDialog('Leave your note!', dialogHtml, "javascript:submitNote()");
        }

        //submit notes
        async function submitNote() {
            const response = await fetch("/post-note", {
                method: "POST",
                headers:{
                    "Content-type": "application/json",
                },
                body: JSON.stringify({
                    name: document.getElementById("namePremined").value,
                    content: document.getElementById("memorable").value,
                })
            });

            let js=await response.json();;

            if(js['success'] == true){
                closeDialog();
                alert("Note successfuly left!");
                fetchNotes();
            }else{
                document.getElementById('modal2').className = "tbhk_img animate__animated animate__slideInDown";
                openDialog2("Whoops!", "My Fault\n Message from Server (if any): \n <h4>" +js['message'] + "<h4/>");
            }
        }


        async function fetchNotes() {
            document.getElementById("lists").innerHTML = "";

            const resp = await fetch("/get-notes", {
                method: "GET",
                headers: {
                    "Content-type": "application/json"
                }
            })

            let json = await resp.json();

            for(var list of json){
                console.log(list);
                document.getElementById("lists").insertAdjacentHTML("beforeend", `<div class="list">
        <p style="text-align:center; padding-top:10px">${list.content}</p>
        <h5>--- ${list.name} <p><i>${list.created_at}</i></p></h5>
    </div>`)
            }
        }
    </script>
</body>

</html>
